<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Lab2</title>
        <style>
        .container{
            background-color: rgb(211, 209, 209);
            width: 100%;
        }
        .menu{
            background-color: rgb(255, 0, 0);
            width: 100%;
            height: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid black;

        }
        .banner{
            background-color: rgb(0, 255, 0);
            width: 100%;
            height: 250px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid black;
        }
        .main1{
            width: 100%;
            height: 200px;
            display: flex;
        }
        .main1-left{
            background-color: rgb(255, 0, 0);
            width: 33.33%;
            height: 100%;
            border: 1px solid black;
            display: flex;
            justify-content: center;
            align-items: center;

        }
        .main1-center{
            background-color: rgb(139, 183, 139);
            width: 33.33%;
            height: 100%;
            border: 1px solid black;
            display: flex;
            justify-content: center;
            align-items: center;

        }
        .main1-right{
            background-color: rgb(0, 0, 255);
            width: 33.33%;
            height: 100%;
            border: 1px solid black;
            display: flex;
            justify-content: center;
            align-items: center;

        }
        .main2{
            width: 100%;
            height: 120px;
            display: flex;
            border: 1px solid black;
        }
        .main2-left{
            background-color: rgb(0, 140, 255);
            width: 50%;
            height: 100%;
            border: 1px solid black;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .main2-right{
            background-color: rgb(241, 239, 136);
            width: 50%;
            height: 100%;
            border: 1px solid black;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .footer{
            background-color: rgb(255, 0, 255);
            width: 100%;
            height: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid black;
        }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="menu">MENU</div>
            <div class="banner">BANNER</div>
            <div class="main1">
                <div class="main1-left">Main1-Left</div>
                <div class="main1-center">Main1-Center</div>
                <div class="main1-right">Main1-Right</div>
            </div>
            <div class="main2">
                <div class="main2-left">Main2-Left</div>
                <div class="main2-right">Main2-Right</div>
            </div>
            <div class="footer">FOOTER</div>
        </div>
    </body>
</html>
