<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta class="viewport" content="width=device-width, initial-scale=1.0">
        <title>Form</title>
        <style>
            .title {
                color: blue;
            }
            .fullname {
                color: red;
            }
            .chose_address {
                color: green;
            }
        </style>
    </head>
    <body>
        <div>
            <H2 class="title">Regiter</H2>
            <p>
                <i>
                    Please
                    <b>fill in this form</b>
                    to create an account
                </i>
            </p>
            <form action="">
                <label for="" class="fullname">Fullname</label>
                <br>
                <input type="text"  placeholder="Input your fullname...">
                <br>
                <br>
                <label for="">Username</label>
                <br>
                <input type="text" placeholder="Input your username...">
                <br>
                <br>
                <label for="">Password</label>
                <br>
                <input type="password" placeholder="Input your password...">
                <br>
                <br>
                <label for="">Email</label>
                <br>
                <input type="text" placeholder="Input your email...">
                <br>
                <br>
                <label for="">Phone number</label>
                <br>
                <input type="text" placeholder="Input your phone number...">
                <br>
            </form>
            <br>
            <div>
                <div>
                    <label for="">Input object:</label>
                    <br>
                    <input type="radio">
                    Student
                    <input type="radio">
                    Teacher
                </div>
                <br>
                <div>
                    <label for="">Favorite:</label>
                    <br>
                    <input type="checkbox">
                    Badminton
                    <input type="checkbox">
                    Voleyball
                    <input type="checkbox">
                    Football
                </div>
                <br>
                <div>
                    <label for="">Address:</label>
                    <br>
                    <select class="chose_address" id="">
                        <option value="" >--Chose address--</option>
                        <option value="">Quang Tri</option>
                        <option value="">Hue</option>
                        <option value="">Da Nang</option>
                    </select>
                </div>
                <br>
                <div>
                    <label for="">Birthday:</label>
                    <br>
                    <input type="date">
                </div>
                <br>
                <div>
                    <label for="">Your picture:</label>
                    <br>
                    <input type="file">
                </div>
                <br>
                <button>Dang Ky</button>
            </div>
        </div>
    </body>
</html>
